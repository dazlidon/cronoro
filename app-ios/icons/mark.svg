<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 896 896">
  <!-- CronoRO — logo principal (fundal hârtie caldă, stil Anthropic) -->
  <defs>
    <clipPath id="bulbTop">
      <path d="M392 312 H632 C632 424 536 468 512 512 C488 468 392 424 392 312 Z"/>
    </clipPath>
    <clipPath id="bulbBottom">
      <path d="M392 712 H632 C632 600 536 556 512 512 C488 556 392 600 392 712 Z"/>
    </clipPath>
  </defs>


  <!-- inelul de ceas -->
  <circle cx="512" cy="512" r="416" fill="none" stroke="#141413" stroke-width="26"/>
  <g stroke="#141413" stroke-width="18" stroke-linecap="round">
    <line x1="512" y1="124" x2="512" y2="168"/>
    <line x1="512" y1="856" x2="512" y2="900"/>
    <line x1="124" y1="512" x2="168" y2="512"/>
    <line x1="856" y1="512" x2="900" y2="512"/>
  </g>
  <g stroke="#9a978c" stroke-width="12" stroke-linecap="round">
    <line x1="706" y1="176" x2="684" y2="214"/>
    <line x1="848" y1="318" x2="810" y2="340"/>
    <line x1="848" y1="706" x2="810" y2="684"/>
    <line x1="706" y1="848" x2="684" y2="810"/>
    <line x1="318" y1="848" x2="340" y2="810"/>
    <line x1="176" y1="706" x2="214" y2="684"/>
    <line x1="176" y1="318" x2="214" y2="340"/>
    <line x1="318" y1="176" x2="340" y2="214"/>
  </g>

  <!-- nisipul tricolor din bulbul de sus: straturile istoriei -->
  <g clip-path="url(#bulbTop)">
    <rect x="380" y="380" width="264" height="44" fill="#002B7F"/>
    <rect x="380" y="424" width="264" height="44" fill="#FCD116"/>
    <rect x="380" y="468" width="264" height="46" fill="#CE1126"/>
  </g>

  <!-- firul de nisip care curge -->
  <g>
    <rect x="504" y="528" width="16" height="34" rx="8" fill="#002B7F"/>
    <rect x="504" y="584" width="16" height="34" rx="8" fill="#FCD116"/>
    <rect x="504" y="640" width="16" height="34" rx="8" fill="#CE1126"/>
  </g>

  <!-- prezentul: movila de nisip în culoarea „book cloth” -->
  <g clip-path="url(#bulbBottom)">
    <path d="M396 714 C448 656 484 642 512 640 C540 642 576 656 628 714 Z" fill="#cc785c"/>
  </g>

  <!-- sticla clepsidrei -->
  <path d="M392 312 H632 C632 424 536 468 512 512 C488 468 392 424 392 312 Z"
        fill="none" stroke="#141413" stroke-width="16" stroke-linejoin="round"/>
  <path d="M392 712 H632 C632 600 536 556 512 512 C488 556 392 600 392 712 Z"
        fill="none" stroke="#141413" stroke-width="16" stroke-linejoin="round"/>

  <!-- barele clepsidrei -->
  <rect x="358" y="272" width="308" height="40" rx="20" fill="#141413"/>
  <rect x="358" y="712" width="308" height="40" rx="20" fill="#141413"/>
</svg>
